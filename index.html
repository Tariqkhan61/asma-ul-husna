<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asma-ul-Husna - 99 Names of Allah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    /* ================= CSS START ================= */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      --card-bg: rgba(255, 255, 255, 0.08);
      --card-border: rgba(255, 255, 255, 0.15);
      --text-main: #fff;
      --text-sub: #94a3b8;
      --text-urdu: #f1f5f9;
      --btn-bg: rgba(255,255,255,0.1);
      --btn-border: rgba(255,255,255,0.2);
      --btn-hover: rgba(255,255,255,0.2);
    }

    body.light-theme {
      --bg-gradient: linear-gradient(135deg, #e0eafc, #cfdef3);
      --card-bg: rgba(255, 255, 255, 0.6);
      --card-border: rgba(0, 0, 0, 0.1);
      --text-main: #1e293b;
      --text-sub: #475569;
      --text-urdu: #0f172a;
      --btn-bg: rgba(255,255,255,0.5);
      --btn-border: rgba(0,0,0,0.1);
      --btn-hover: rgba(255,255,255,0.8);
    }

    body {
      min-height: 100vh;
      font-family: 'Amiri', serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      transition: background 0.5s ease, color 0.5s ease;
    }

    .glow {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.5;
      animation: float 8s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }
    .glow-1 { width: 400px; height: 400px; background: #8b5cf6; top: -100px; left: -100px; }
    .glow-2 { width: 350px; height: 350px; background: #06b6d4; bottom: -100px; right: -100px; animation-delay: 2s; }
    body.light-theme .glow { opacity: 0.3; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(30px, -30px); }
    }

    .stars {
      position: absolute;
      inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20% 30%, white, transparent),
        radial-gradient(2px 2px at 80% 70%, white, transparent),
        radial-gradient(1px 1px at 50% 50%, white, transparent),
        radial-gradient(1px 1px at 10% 90%, white, transparent);
      background-size: 200px 200px;
      opacity: 0.4;
      animation: twinkle 5s ease-in-out infinite;
      transition: opacity 0.5s ease;
    }
    body.light-theme .stars { opacity: 0; }
    @keyframes twinkle { 0%,100% {opacity:0.3} 50% {opacity:0.7} }

    .container { z-index: 10; text-align: center; padding: 20px; width: 100%; max-width: 450px; }

    .title {
      font-size: 2rem;
      background: linear-gradient(90deg, #fbbf24, #f472b6, #60a5fa);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle { font-family: sans-serif; font-size: 0.9rem; color: var(--text-sub); margin-bottom: 24px; }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      padding: 30px 20px;
      box-shadow: 0 20px 60px rgba(139, 92, 246, 0.15);
      transition: transform 0.4s ease, opacity 0.4s ease, background 0.5s ease, border 0.5s ease;
      position: relative;
    }
    .card.fade { opacity: 0; transform: scale(0.95); }

    .speak-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.4);
      color: #a78bfa;
      width: 40px; height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex; justify-content: center; align-items: center;
      transition: all 0.3s;
    }
    .speak-btn:hover { background: rgba(139, 92, 246, 0.4); color: #fff; transform: scale(1.1); }
    .speak-btn.playing { animation: pulse 1s infinite; background: rgba(139, 92, 246, 0.6); color: white;}
    
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); }
      100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
    }

    .counter { font-family: sans-serif; font-size: 0.85rem; color: #a78bfa; margin-bottom: 16px; letter-spacing: 2px; }

    .arabic-name {
      font-size: 3.5rem;
      background: linear-gradient(180deg, #fbbf24, #d97706);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.4;
      transition: font-size 0.3s ease;
    }
    body.light-theme .arabic-name {
      background: linear-gradient(180deg, #b45309, #78350f);
      -webkit-background-clip: text;
      background-clip: text;
    }

    .transliteration { font-family: sans-serif; font-size: 1.1rem; color: var(--text-sub); margin-top: 8px; }

    .divider {
      width: 60px; height: 2px; margin: 20px auto;
      background: linear-gradient(90deg, transparent, #a78bfa, transparent);
    }

    .urdu-meaning {
      font-family: 'Noto Nastaliq Urdu', serif;
      font-size: 1.6rem;
      color: var(--text-urdu);
      line-height: 2.2;
      direction: rtl;
    }

    .controls { margin-top: 28px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

    .btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-main);
      padding: 12px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn:hover { background: var(--btn-hover); transform: translateY(-2px); }
    .btn.primary { background: linear-gradient(90deg, #8b5cf6, #ec4899); border: none; color: #fff;}
    .btn.primary:hover { box-shadow: 0 8px 24px rgba(236,72,153,0.4); }

    .top-controls {
      position: absolute;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
      z-index: 20;
    }
    .icon-btn {
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      color: var(--text-main);
      width: 45px; height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex; justify-content: center; align-items: center;
      backdrop-filter: blur(10px);
      transition: all 0.3s;
    }
    .icon-btn:hover { background: var(--btn-hover); transform: scale(1.1); }

    @media (max-width: 480px) {
      .title { font-size: 1.6rem; }
      .container { padding: 15px; }
      .card { padding: 30px 20px; border-radius: 20px; }
      .arabic-name { font-size: 2.8rem; }
      .urdu-meaning { font-size: 1.3rem; line-height: 2; }
      .btn { padding: 10px 14px; font-size: 0.9rem; }
      .top-controls { top: 15px; right: 15px; }
      .icon-btn { width: 40px; height: 40px; font-size: 1rem; }
    }
    /* ================= CSS END ================= */
  </style>
</head>

    const urduEl     = document.getElementById('urdu');
    const counterEl  = document.getElementById('counter');
    const card       = document.getElementById('card');
    const speakBtn   = document.getElementById('speakBtn');
    const themeToggleBtn = document.getElementById('themeToggle');

    // 1. VOICE SETUP (Ensure voice loads properly)
    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    // 2. PLAY AUDIO (Using Browser's Native TTS)
    function playCurrentAudio() {
      if (isMuted) return;
      
      // Stop any ongoing speech
      window.speechSynthesis.cancel(); 
      speakBtn.classList.remove('playing');

      const arabicText = names[currentIndex].arabic;
      const utterance = new SpeechSynthesisUtterance(arabicText);
      
      // Trick: Try to find Arabic, Urdu, or Hindi voice.
      // If none found, just use the default system voice.
      let voice = voices.find(v => v.lang.includes('ar')) || 
                  voices.find(v => v.lang.includes('ur')) || 
                  voices.find(v => v.lang.includes('hi')) || 
                  voices[0];
                  
      if (voice) {
        utterance.voice = voice;
      }
      
      utterance.rate = 0.8; // Slow speed for clear pronunciation
      utterance.pitch = 1;

      // Animation
      utterance.onstart = () => speakBtn.classList.add('playing');
      utterance.onend = () => speakBtn.classList.remove('playing');
      utterance.onerror = () => speakBtn.classList.remove('playing');

      // Play
      window.speechSynthesis.speak(utterance);
    }

    speakBtn.onclick = () => {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
        speakBtn.classList.remove('playing');
      } else {
        playCurrentAudio();
      }
    };

    function showName(index) {
      card.classList.add('fade');
      
      // Stop ongoing audio when changing name
      window.speechSynthesis.cancel(); 
      speakBtn.classList.remove('playing');

      setTimeout(() => {
        const n = names[index];
        arabicEl.textContent   = n.arabic;
        translitEl.textContent = n.translit;
        urduEl.textContent     = n.urdu;
        counterEl.textContent  = `${index + 1} / ${names.length}`;
        card.classList.remove('fade');
      }, 400); 
    }

    document.getElementById('next').onclick = () => {
      currentIndex = (currentIndex + 1) % names.length;
      showName(currentIndex);
    };

    document.getElementById('prev').onclick = () => {
      currentIndex = (currentIndex - 1 + names.length) % names.length;
      showName(currentIndex);
    };

    document.getElementById('random').onclick = () => {
      let newIndex;
      do {
        newIndex = Math.floor(Math.random() * names.length);
      } while (newIndex === currentIndex);
      currentIndex = newIndex;
      showName(currentIndex);
    };

    document.getElementById('autoplay').onclick = (e) => {
      if (autoPlayInterval) {
        clearInterval(autoPlayInterval);
        autoPlayInterval = null;
        e.target.textContent = '▶ Auto';
        window.speechSynthesis.cancel(); // Stop audio on pause
      } else {
        playCurrentAudio(); 
        
        autoPlayInterval = setInterval(() => {
          currentIndex = (currentIndex + 1) % names.length;
          showName(currentIndex);
          // Wait for the fade animation, then play audio
          setTimeout(playCurrentAudio, 500);
        }, 4000); 
        
        e.target.textContent = '⏸ Pause';
      }
    };

    themeToggleBtn.onclick = () => {
      document.body.classList.toggle('light-theme');
      if (document.body.classList.contains('light-theme')) {
        themeToggleBtn.textContent = '☀️';
      } else {
        themeToggleBtn.textContent = '🌙';
      }
    };

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') document.getElementById('next').click();
      if (e.key === 'ArrowLeft')  document.getElementById('prev').click();
      if (e.key === ' ') {
        e.preventDefault();
        document.getElementById('autoplay').click();
      }
    });
  </script>
</body>
</html>
